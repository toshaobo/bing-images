name: 每天自动同步必应壁纸

on:
  schedule:
    - cron: '17 22 * * *' # 北京时间 06:17
    - cron: '23 1 * * *'  # 北京时间 09:23
  workflow_dispatch:

permissions:
  contents: write # 赋予写入权限，解决 403 和 128 报错

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 运行下载脚本
      - run: node download-bing.js

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 先拉取远端最新代码并变基同步，彻底解决 "fetch first" 报错
          git pull origin main --rebase || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git add images/
            git commit -m "chore: 🤖 自动同步今日必应高清壁纸"
            git push origin main
            echo "✅ 新图片已成功推送到仓库！"
          else
            echo "🎵 今天已经是最新图片，无需重复更新。"
          fi
