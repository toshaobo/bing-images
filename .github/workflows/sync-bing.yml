name: 每天自动同步必应壁纸

on:
  schedule:
    - cron: '17 22 * * *' # 北京时间 06:17
    - cron: '23 1 * * *'  # 北京时间 09:23
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 运行下载脚本（确保 download-bing.js 在仓库里，并且它会把图片下载到 bing-images/ 目录）
      - run: node download-bing.js

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            # 这里改成你实际存放图片的文件夹路径（比如 bing-images/）
            git add images/
            git commit -m "chore: 🤖 自动同步今日必应高清壁纸"
            git push origin main
            echo "✅ 新图片已成功推送到仓库！"
          else
            echo "🎵 今天已经是最新图片，无需重复更新。"
          fi
